apiVersion: apps/v1
kind: Deployment

metadata:
  name: auth-service-db

spec:
  replicas: 1

  selector:
    matchLabels:
      app: auth-service-db

  template:
    metadata:
      labels:
        app: auth-service-db

    spec:
      containers:
        - name: postgres

          image: postgres:18

          ports:
            - containerPort: 5432

          env:
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: auth-db-secret
                  key: POSTGRES_DB

            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: auth-db-secret
                  key: POSTGRES_USER

            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: auth-db-secret
                  key: POSTGRES_PASSWORD

          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql

      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: auth-db-pvc