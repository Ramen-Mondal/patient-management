apiVersion: apps/v1
kind: Deployment

metadata:
  name: kafka

spec:
  replicas: 1

  selector:
    matchLabels:
      app: kafka

  template:
    metadata:
      labels:
        app: kafka

    spec:
      containers:
        - name: kafka

          image: bitnamilegacy/kafka:latest

          ports:
            - containerPort: 9092

            - containerPort: 9093

            - containerPort: 9094

          envFrom:
            - configMapRef:
                name: kafka-config