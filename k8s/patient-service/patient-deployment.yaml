apiVersion: apps/v1
kind: Deployment

metadata:
  name: patient-service

spec:
  replicas: 1

  selector:
    matchLabels:
      app: patient-service

  template:
    metadata:
      labels:
        app: patient-service

    spec:
      containers:
        - name: patient-service
          image: patient-service:latest

          imagePullPolicy: Never

          ports:
            - containerPort: 4000

          envFrom:
            - configMapRef:
                name: patient-service-config

          env:
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: patient-db-secret
                  key: POSTGRES_USER

            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: patient-db-secret
                  key: POSTGRES_PASSWORD